%YAML 1.2
---
$id: http://devicetree.org/schemas/display/panel/boe,bf068-rm692h0.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: BOE BF068 RM692H0 AMOLED DSI panel

maintainers:
  - Cosmin Tanislav <demonsingur@gmail.com>

description:
  The BOE BF068 is a 6.8 inch 1116x2480 AMOLED panel driven by a Raydium
  RM692H0 controller. It runs in DSC compressed command mode over a four
  lane MIPI DSI link.

allOf:
  - $ref: panel-common.yaml#

properties:
  compatible:
    const: boe,bf068-rm692h0

  reg:
    maxItems: 1

  vddio-supply:
    description: 1.8V I/O supply

  vddd-supply:
    description: 1.2V digital supply

  vdd-supply:
    description: 1.2V supply

  vci-supply:
    description: 3.0V analog supply

required:
  - compatible
  - reg
  - reset-gpios
  - vddio-supply
  - vddd-supply
  - vdd-supply
  - vci-supply
  - port

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    dsi {
        #address-cells = <1>;
        #size-cells = <0>;

        panel@0 {
            compatible = "boe,bf068-rm692h0";
            reg = <0>;

            reset-gpios = <&tlmm 133 GPIO_ACTIVE_LOW>;

            vddio-supply = <&panel_vddio>;
            vddd-supply = <&panel_vddd>;
            vdd-supply = <&vreg_l11b_1p2>;
            vci-supply = <&vreg_l13b_3p0>;

            port {
                endpoint {
                    remote-endpoint = <&mdss_dsi0_out>;
                };
            };
        };
    };

...
