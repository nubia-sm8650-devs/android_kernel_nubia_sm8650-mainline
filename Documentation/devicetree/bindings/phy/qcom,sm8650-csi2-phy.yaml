%YAML 1.2
---
$id: http://devicetree.org/schemas/phy/qcom,sm8650-csi2-phy.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm SM8650 CSI2 PHY

maintainers:
  - Cosmin Tanislav <demonsingur@gmail.com>

description:
  Qualcomm MIPI CSI2 D-PHY / C-PHY. Connects MIPI CSI2 sensors to Qualcomm's
  Camera CSI Decoder on the SM8650 SoC.

properties:
  compatible:
    enum:
      - qcom,sm8650-csi2-phy

  reg:
    maxItems: 1

  clocks:
    maxItems: 3

  clock-names:
    items:
      - const: core
      - const: timer
      - const: csiphy_rx

  interrupts:
    maxItems: 1

  operating-points-v2: true

  opp-table:
    type: object

  power-domains:
    items:
      - description: Titan Top GDSC - Titan ISP Block, Global Distributed Switch Controller.

  power-domain-names:
    items:
      - const: top

  vdda-phy-supply:
    description: Phandle to PHY supply.

  vdda-pll-supply:
    description: Phandle to PLL supply.

  qcom,channel-type:
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [ 0, 1 ]
    default: 0
    description:
      C-PHY data rate channel calibration variant the connected module
      requires, 0 for the short channel and 1 for the standard channel rate
      table entries.

  ports:
    $ref: /schemas/graph.yaml#/properties/ports

    properties:
      port@0:
        $ref: /schemas/graph.yaml#/$defs/port-base
        description:
          Sensor input. A single sensor is described by a single endpoint
          with one to four data lanes, numbered 1-4. The clock lane is
          position 0.

        unevaluatedProperties: false

        patternProperties:
          "^endpoint(@0)?$":
            $ref: /schemas/media/video-interfaces.yaml#
            unevaluatedProperties: false
            properties:
              bus-type:
                enum:
                  - 1 # MEDIA_BUS_TYPE_CSI2_CPHY
                  - 4 # MEDIA_BUS_TYPE_CSI2_DPHY
                default: 4

              data-lanes:
                minItems: 1
                maxItems: 4
                items:
                  minimum: 1
                  maximum: 4
                description:
                  Data lane positions following this endpoint's clock
                  lane. Positions are a per-port logical numbering, not
                  package pad or ball positions.

            required:
              - data-lanes
              - remote-endpoint

      port@1:
        $ref: /schemas/graph.yaml#/properties/port
        description: Output to the CAMSS CSIPHY controller.

    required:
      - port@0
      - port@1

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - interrupts
  - operating-points-v2
  - power-domains
  - power-domain-names
  - vdda-phy-supply
  - vdda-pll-supply
  - ports

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/qcom,sm8650-camcc.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/media/video-interfaces.h>

    csiphy0: phy@ace4000 {
        compatible = "qcom,sm8650-csi2-phy";
        reg = <0x0ace4000 0x2000>;

        clocks = <&camcc CAM_CC_CSIPHY0_CLK>,
                 <&camcc CAM_CC_CSI0PHYTIMER_CLK>,
                 <&camcc CAM_CC_CSID_CSIPHY_RX_CLK>;
        clock-names = "core",
                      "timer",
                      "csiphy_rx";

        interrupts = <GIC_SPI 477 IRQ_TYPE_EDGE_RISING>;

        operating-points-v2 = <&csiphy_opp_table>;

        power-domains = <&camcc CAM_CC_TITAN_TOP_GDSC>;
        power-domain-names = "top";

        vdda-phy-supply = <&vreg_l2i_0p88>;
        vdda-pll-supply = <&vreg_l3i_1p2>;

        ports {
            #address-cells = <1>;
            #size-cells = <0>;

            port@0 {
                reg = <0>;
                csiphy0_in: endpoint {
                    bus-type = <MEDIA_BUS_TYPE_CSI2_CPHY>;
                    data-lanes = <1 2 3>;
                    remote-endpoint = <&sensor_out>;
                };
            };

            port@1 {
                reg = <1>;
                csiphy0_out: endpoint {
                    remote-endpoint = <&camss_ep0>;
                };
            };
        };
    };

    csiphy_opp_table: opp-table-csiphy {
        compatible = "operating-points-v2";

        opp-400000000 {
            opp-hz = /bits/ 64 <400000000>;
        };

        opp-480000000 {
            opp-hz = /bits/ 64 <480000000>;
        };
    };
...
